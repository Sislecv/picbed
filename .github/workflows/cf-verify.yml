name: cf-verify
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: upload to workers edge
        run: |
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > /tmp/cf-actions-test.png
          curl -sS -m 60 -X POST --data-binary @/tmp/cf-actions-test.png \
            "https://upimg-web.sislecv2.workers.dev/upload?name=cf-actions-test.png"
